<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能PDF阅读器 - 支持侧边栏收纳 | 笔记与状态记录</title>
    <!-- PDF.js 核心库和 Worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            background: #2d2d2f;
            height: 100vh;
            overflow: hidden;
            color: #e4e4e7;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: #1e1e1f;
            transition: all 0.2s ease;
        }

        /* 左侧大纲面板 - 可隐藏 */
        .outline-panel {
            width: 280px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.2s ease, border 0.2s ease, margin 0.2s ease;
        }
        .outline-panel.hidden {
            width: 0;
            overflow: hidden;
            border-right: none;
            padding: 0;
            margin: 0;
            min-width: 0;
        }

        .panel-header {
            padding: 16px 18px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            font-weight: 600;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            backdrop-filter: blur(4px);
            background: rgba(45, 45, 48, 0.95);
            z-index: 2;
            white-space: nowrap;
        }
        .outline-panel.hidden .panel-header {
            display: none;
        }
        .outline-content {
            flex: 1;
            padding: 12px 8px 20px 12px;
            overflow-y: auto;
        }
        .outline-panel.hidden .outline-content {
            display: none;
        }

        .outline-item {
            cursor: pointer;
            padding: 8px 10px;
            margin: 4px 0;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: #cccccc;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .outline-item:hover {
            background: #3e3e42;
            color: white;
            transform: translateX(3px);
        }

        .outline-item.level-1 { padding-left: 24px; }
        .outline-item.level-2 { padding-left: 40px; }
        .outline-item.level-3 { padding-left: 56px; }
        .no-outline {
            color: #8f8f9b;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        /* 中间阅读区 */
        .reader-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #2b2b2e;
            overflow: hidden;
            min-width: 0;
        }

        .toolbar {
            background: #323235;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #3e3e42;
            justify-content: center;
        }

        .file-control {
            background: #252526;
            padding: 5px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-control label {
            background: #0e639c;
            padding: 6px 14px;
            border-radius: 32px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .file-control label:hover {
            background: #1177bb;
        }
        .file-control span {
            font-size: 0.8rem;
            color: #bbbbbb;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        input[type="file"] {
            display: none;
        }

        .page-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #252526;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .page-control button {
            background: #0e639c;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 32px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-control button:hover { background: #1177bb; }
        .page-control span {
            font-size: 1rem;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }
        .page-jump {
            display: flex;
            gap: 8px;
            background: #252526;
            padding: 4px 12px;
            border-radius: 32px;
            align-items: center;
        }
        .page-jump input {
            width: 60px;
            background: #3c3c3f;
            border: 1px solid #555;
            border-radius: 20px;
            padding: 6px 10px;
            color: white;
            text-align: center;
        }
        .page-jump button {
            background: #3c3c3f;
            border: none;
            color: #ddd;
            padding: 5px 14px;
            border-radius: 32px;
            cursor: pointer;
        }
        .note-quick {
            background: #6a4e2e;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 28px;
            cursor: pointer;
            font-weight: 500;
        }
        .note-quick:hover { background: #8b6239; }

        /* 侧边栏隐藏/显示按钮 */
        .toggle-panel-btn {
            background: #3c3c3f;
            border: none;
            color: #ddd;
            padding: 6px 14px;
            border-radius: 28px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .toggle-panel-btn:hover {
            background: #505055;
            color: white;
        }

        .pdf-canvas-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
            background: #1e1e20;
        }
        canvas {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            background: white;
            display: block;
            width: auto;
            height: auto;
        }
        .no-pdf-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            text-align: center;
            padding: 40px;
        }
        .no-pdf-placeholder button {
            margin-top: 20px;
            background: #0e639c;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* 右侧笔记面板 - 可隐藏 */
        .notes-panel {
            width: 320px;
            background: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s ease, border 0.2s ease;
        }
        .notes-panel.hidden {
            width: 0;
            overflow: hidden;
            border-left: none;
            padding: 0;
            margin: 0;
            min-width: 0;
        }
        .notes-panel.hidden .notes-header,
        .notes-panel.hidden .add-note-form,
        .notes-panel.hidden .notes-list {
            display: none;
        }

        .notes-header {
            padding: 16px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            white-space: nowrap;
        }
        .add-note-form {
            padding: 16px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
        }
        .add-note-form input, .add-note-form textarea {
            width: 100%;
            background: #3c3c3f;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 10px;
        }
        .add-note-form textarea { min-height: 60px; }
        .add-note-form button {
            background: #0e639c;
            border: none;
            color: white;
            padding: 8px 0;
            width: 100%;
            border-radius: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .note-card {
            background: #323235;
            margin-bottom: 12px;
            border-radius: 14px;
            padding: 12px;
            border-left: 4px solid #e67e22;
            cursor: pointer;
            transition: 0.1s;
        }
        .note-card:hover { background: #3e3e42; transform: translateX(-2px); }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .note-page {
            background: #e67e22;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .note-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #eaeaea;
            word-break: break-word;
        }
        .delete-note {
            background: none;
            border: none;
            color: #f28b82;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .delete-note:hover { opacity: 1; }
        .empty-notes {
            text-align: center;
            padding: 40px 20px;
            color: #8f8f9b;
            font-style: italic;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2d2d30; }
        ::-webkit-scrollbar-thumb { background: #5a5a5e; border-radius: 4px; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 左侧 PDF 目录区 -->
    <div class="outline-panel" id="outlinePanel">
        <div class="panel-header">📑 文档目录</div>
        <div class="outline-content" id="outlineContainer">
            <div class="no-outline">请先选择 PDF 文件</div>
        </div>
    </div>

    <!-- 中间 PDF 阅读器 -->
    <div class="reader-panel">
        <div class="toolbar">
            <div class="file-control">
                <label for="pdfFileInput">📂 选择 PDF</label>
                <input type="file" id="pdfFileInput" accept=".pdf">
                <span id="currentFileNameSpan">未打开文件</span>
            </div>
            <div class="page-control">
                <button id="prevPageBtn">◀</button>
                <span id="pageInfo">第 - / - 页</span>
                <button id="nextPageBtn">▶</button>
            </div>
            <div class="page-jump">
                <span>跳转</span>
                <input type="number" id="jumpPageInput" min="1" value="1">
                <button id="jumpBtn">Go</button>
            </div>
            <button class="note-quick" id="quickNoteBtn">📝 添加当前页笔记</button>
            <!-- 侧边栏收纳按钮 -->
            <button class="toggle-panel-btn" id="toggleOutlineBtn" title="隐藏/显示左侧目录">📁 隐藏目录</button>
            <button class="toggle-panel-btn" id="toggleNotesBtn" title="隐藏/显示右侧笔记">📌 隐藏笔记</button>
        </div>
        <div class="pdf-canvas-container" id="canvasContainer">
            <div id="pdfPlaceholder" class="no-pdf-placeholder">
                📄 暂无 PDF 文件<br>请点击上方「选择 PDF」按钮打开电子书
            </div>
            <canvas id="pdfCanvas" style="display: none;"></canvas>
        </div>
    </div>

    <!-- 右侧笔记区 -->
    <div class="notes-panel" id="notesPanel">
        <div class="notes-header">
            <span>📌 我的笔记目录</span>
            <span style="font-size:12px;">点击笔记跳转页</span>
        </div>
        <div class="add-note-form">
            <input type="number" id="notePageNum" placeholder="页码 (默认当前页)" value="">
            <textarea id="noteContent" placeholder="写下你的笔记内容..."></textarea>
            <button id="addNoteBtn">+ 添加笔记</button>
        </div>
        <div class="notes-list" id="notesListContainer">
            <div class="empty-notes">请先打开PDF文件<br>添加笔记将自动保存</div>
        </div>
    </div>
</div>

<script>
    // ---------- 全局变量 ----------
    let pdfDoc = null;
    let currentPageNum = 1;
    let totalPages = 0;
    let currentRendering = null;
    let currentFileName = null;
    let resizeObserver = null;
    
    // 笔记数组
    let notesArray = [];        
    
    // DOM 元素
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const pageInfoSpan = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const jumpBtn = document.getElementById('jumpBtn');
    const jumpInput = document.getElementById('jumpPageInput');
    const quickNoteBtn = document.getElementById('quickNoteBtn');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const noteContentTa = document.getElementById('noteContent');
    const notePageNumInput = document.getElementById('notePageNum');
    const notesListContainer = document.getElementById('notesListContainer');
    const outlineContainer = document.getElementById('outlineContainer');
    const currentFileNameSpan = document.getElementById('currentFileNameSpan');
    const pdfFileInput = document.getElementById('pdfFileInput');
    const pdfPlaceholderDiv = document.getElementById('pdfPlaceholder');
    const canvasContainer = document.getElementById('canvasContainer');
    const outlinePanel = document.getElementById('outlinePanel');
    const notesPanel = document.getElementById('notesPanel');
    const toggleOutlineBtn = document.getElementById('toggleOutlineBtn');
    const toggleNotesBtn = document.getElementById('toggleNotesBtn');
    
    // ---------- 侧边栏收纳逻辑 (带状态存储) ----------
    let outlineHidden = false;
    let notesHidden = false;
    
    function loadPanelState() {
        try {
            const savedOutline = localStorage.getItem('pdf_reader_ui_outline_hidden');
            const savedNotes = localStorage.getItem('pdf_reader_ui_notes_hidden');
            if (savedOutline === 'true') outlineHidden = true;
            if (savedNotes === 'true') notesHidden = true;
        } catch(e) {}
        applyPanelState();
    }
    
    function savePanelState() {
        localStorage.setItem('pdf_reader_ui_outline_hidden', outlineHidden);
        localStorage.setItem('pdf_reader_ui_notes_hidden', notesHidden);
    }
    
    function applyPanelState() {
        if (outlineHidden) {
            outlinePanel.classList.add('hidden');
            toggleOutlineBtn.innerHTML = '📁 显示目录';
        } else {
            outlinePanel.classList.remove('hidden');
            toggleOutlineBtn.innerHTML = '📁 隐藏目录';
        }
        if (notesHidden) {
            notesPanel.classList.add('hidden');
            toggleNotesBtn.innerHTML = '📌 显示笔记';
        } else {
            notesPanel.classList.remove('hidden');
            toggleNotesBtn.innerHTML = '📌 隐藏笔记';
        }
        // 面板显示/隐藏后触发重新布局，让canvas自适应
        setTimeout(() => handleResize(), 50);
    }
    
    function toggleOutline() {
        outlineHidden = !outlineHidden;
        applyPanelState();
        savePanelState();
        // 手动触发重新渲染PDF以适应新尺寸
        handleResize();
    }
    
    function toggleNotes() {
        notesHidden = !notesHidden;
        applyPanelState();
        savePanelState();
        handleResize();
    }
    
    // ---------- 存储辅助 (基于文件名) ----------
    function getStoragePrefix() {
        if (!currentFileName) return null;
        const safeName = currentFileName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5._-]/g, '_');
        return `pdf_reader_${safeName}`;
    }
    
    function saveNotesToLocal() {
        if (!currentFileName) return;
        const prefix = getStoragePrefix();
        localStorage.setItem(`${prefix}_notes`, JSON.stringify(notesArray));
    }
    
    function loadNotesFromLocal() {
        if (!currentFileName) {
            notesArray = [];
            renderNotesList();
            return;
        }
        const prefix = getStoragePrefix();
        const stored = localStorage.getItem(`${prefix}_notes`);
        if (stored) {
            try {
                notesArray = JSON.parse(stored);
                if (!Array.isArray(notesArray)) notesArray = [];
            } catch(e) { notesArray = []; }
        } else {
            notesArray = [];
        }
        notesArray.sort((a,b) => a.pageNum - b.pageNum);
        renderNotesList();
    }
    
    function saveLastPage(page) {
        if (!currentFileName) return;
        const prefix = getStoragePrefix();
        localStorage.setItem(`${prefix}_lastpage`, page);
    }
    
    function loadLastPage() {
        if (!currentFileName) return 1;
        const prefix = getStoragePrefix();
        const last = localStorage.getItem(`${prefix}_lastpage`);
        if (last && !isNaN(parseInt(last))) {
            return parseInt(last);
        }
        return 1;
    }
    
    // ---------- UI 渲染笔记 ----------
    function renderNotesList() {
        if (!notesListContainer) return;
        if (!currentFileName) {
            notesListContainer.innerHTML = '<div class="empty-notes">📂 请先选择 PDF 文件<br>笔记将跟随文件保存</div>';
            return;
        }
        if (notesArray.length === 0) {
            notesListContainer.innerHTML = '<div class="empty-notes">📖 暂无笔记，选中页面后添加笔记<br>点击笔记可快速跳转</div>';
            return;
        }
        let html = '';
        notesArray.forEach(note => {
            let preview = note.text.length > 50 ? note.text.substring(0, 50) + '...' : note.text;
            html += `
                <div class="note-card" data-page="${note.pageNum}" data-id="${note.id}">
                    <div class="note-header">
                        <span class="note-page">📍 第 ${note.pageNum} 页</span>
                        <button class="delete-note" data-id="${note.id}" title="删除笔记">🗑️</button>
                    </div>
                    <div class="note-text">${escapeHtml(preview)}</div>
                </div>
            `;
        });
        notesListContainer.innerHTML = html;
        
        document.querySelectorAll('.delete-note').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                deleteNoteById(id);
            });
        });
        document.querySelectorAll('.note-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-note')) return;
                const page = parseInt(card.getAttribute('data-page'));
                if (!isNaN(page) && page >= 1 && totalPages && page <= totalPages) {
                    goToPage(page);
                } else if (totalPages) {
                    alert(`页码超出范围（1-${totalPages}）`);
                }
            });
        });
    }
    
    function deleteNoteById(id) {
        notesArray = notesArray.filter(n => n.id != id);
        saveNotesToLocal();
        renderNotesList();
    }
    
    function addNote(pageNum, text) {
        if (!currentFileName) {
            alert("请先选择一个 PDF 文件");
            return false;
        }
        if (!text || text.trim() === "") {
            alert("笔记内容不能为空");
            return false;
        }
        if (isNaN(pageNum) || pageNum < 1 || (totalPages > 0 && pageNum > totalPages)) {
            alert(`页码无效，应在 1 - ${totalPages} 之间`);
            return false;
        }
        const newNote = {
            id: Date.now() + "-" + Math.floor(Math.random() * 10000),
            pageNum: parseInt(pageNum),
            text: text.trim(),
            timestamp: Date.now()
        };
        notesArray.push(newNote);
        notesArray.sort((a,b) => a.pageNum - b.pageNum);
        saveNotesToLocal();
        renderNotesList();
        return true;
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ---------- 核心渲染函数：自适应比例，支持滚动 ----------
    function calculateScale(viewportWidth) {
        if (!canvasContainer) return 1.5;
        const containerRect = canvasContainer.getBoundingClientRect();
        const availableWidth = containerRect.width - 40; 
        if (availableWidth <= 0) return 1.2;
        let scale = availableWidth / viewportWidth;
        scale = Math.min(2.5, Math.max(0.6, scale));
        return scale;
    }
    
    async function renderPage(pageNumber) {
        if (!pdfDoc) return;
        if (pageNumber < 1) pageNumber = 1;
        if (pageNumber > totalPages) pageNumber = totalPages;
        currentPageNum = pageNumber;
        
        pageInfoSpan.innerText = `第 ${currentPageNum} / ${totalPages} 页`;
        jumpInput.value = currentPageNum;
        saveLastPage(currentPageNum);
        
        try {
            const page = await pdfDoc.getPage(pageNumber);
            const originalViewport = page.getViewport({ scale: 1 });
            const baseWidth = originalViewport.width;
            const scale = calculateScale(baseWidth);
            const viewport = page.getViewport({ scale: scale });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            
            const renderContext = {
                canvasContext: ctx,
                viewport: viewport,
                background: 'white'
            };
            if (currentRendering) {
                try { await currentRendering; } catch(e) {}
            }
            currentRendering = page.render(renderContext);
            await currentRendering;
            currentRendering = null;
        } catch (err) {
            console.error("渲染失败: ", err);
        }
    }
    
    function handleResize() {
        if (pdfDoc && currentPageNum) {
            renderPage(currentPageNum);
        }
    }
    
    function observeContainerResize() {
        if (resizeObserver) resizeObserver.disconnect();
        if (!canvasContainer) return;
        resizeObserver = new ResizeObserver(() => {
            handleResize();
        });
        resizeObserver.observe(canvasContainer);
    }
    
    function goToPage(pageNum) {
        if (!pdfDoc) return;
        if (pageNum < 1) pageNum = 1;
        if (pageNum > totalPages) pageNum = totalPages;
        if (currentPageNum !== pageNum) {
            renderPage(pageNum);
        } else {
            renderPage(pageNum);
        }
    }
    
    function nextPage() { if (currentPageNum < totalPages) goToPage(currentPageNum + 1); }
    function prevPage() { if (currentPageNum > 1) goToPage(currentPageNum - 1); }
    
    // 从 PDF 加载大纲目录
    async function loadOutline() {
        if (!pdfDoc) return;
        try {
            const outline = await pdfDoc.getOutline();
            outlineContainer.innerHTML = '';
            if (!outline || outline.length === 0) {
                outlineContainer.innerHTML = '<div class="no-outline">📄 本文档无目录大纲</div>';
                return;
            }
            function buildOutlineItems(items, level = 0) {
                let html = '';
                for (let item of items) {
                    const title = item.title || '无标题';
                    const dest = item.dest;
                    html += `<div class="outline-item level-${level}" data-dest='${JSON.stringify(dest)}' data-title="${escapeHtml(title)}">📘 ${escapeHtml(title)}</div>`;
                    if (item.items && item.items.length) html += buildOutlineItems(item.items, level + 1);
                }
                return html;
            }
            outlineContainer.innerHTML = buildOutlineItems(outline);
            document.querySelectorAll('.outline-item').forEach(el => {
                el.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const destRaw = el.getAttribute('data-dest');
                    if (!destRaw || destRaw === 'null' || !pdfDoc) return;
                    try {
                        let dest = JSON.parse(destRaw);
                        let pageTarget = null;
                        if (typeof dest === 'string') {
                            const destination = await pdfDoc.getDestination(dest);
                            if (destination) dest = destination;
                        }
                        if (Array.isArray(dest) && dest.length >= 1) {
                            const pageRef = dest[0];
                            if (pageRef && typeof pageRef === 'object') {
                                const pageIndex = await pdfDoc.getPageIndex(pageRef);
                                pageTarget = pageIndex + 1;
                            } else if (typeof pageRef === 'number') {
                                pageTarget = pageRef;
                            }
                        }
                        if (pageTarget && pageTarget >= 1 && pageTarget <= totalPages) {
                            goToPage(pageTarget);
                        } else {
                            console.warn("无法解析目标页码");
                        }
                    } catch (err) {
                        console.error("大纲跳转错误", err);
                    }
                });
            });
        } catch (err) {
            outlineContainer.innerHTML = '<div class="no-outline">大纲解析失败</div>';
        }
    }
    
    function resetUIForNewPDF() {
        pdfPlaceholderDiv.style.display = 'none';
        canvas.style.display = 'block';
        outlineContainer.innerHTML = '<div class="no-outline">加载目录中...</div>';
        pageInfoSpan.innerText = `第 - / - 页`;
        jumpInput.value = 1;
        notesListContainer.innerHTML = '<div class="empty-notes">加载笔记中...</div>';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    
    async function loadPDFFromFile(file) {
        if (!file) return;
        if (pdfDoc) pdfDoc = null;
        currentFileName = file.name;
        currentFileNameSpan.innerText = currentFileName;
        notesArray = [];
        resetUIForNewPDF();
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            pageInfoSpan.innerText = `第 1 / ${totalPages} 页`;
            jumpInput.max = totalPages;
            
            const lastPage = loadLastPage();
            let startPage = (lastPage >= 1 && lastPage <= totalPages) ? lastPage : 1;
            currentPageNum = startPage;
            await renderPage(currentPageNum);
            await loadOutline();
            loadNotesFromLocal();
            notePageNumInput.value = currentPageNum;
        } catch (err) {
            console.error("PDF 加载失败", err);
            pdfPlaceholderDiv.style.display = 'flex';
            canvas.style.display = 'none';
            outlineContainer.innerHTML = `<div class="no-outline" style="color:#f28b82;">⚠️ 文件加载失败: ${err.message}<br>请确保文件是有效的PDF</div>`;
            currentFileNameSpan.innerText = "加载失败";
            currentFileName = null;
            notesListContainer.innerHTML = '<div class="empty-notes">文件加载失败，请重新选择PDF</div>';
            pageInfoSpan.innerText = `第 - / - 页`;
        }
    }
    
    function onFileSelected(event) {
        const file = event.target.files[0];
        if (file && file.type === 'application/pdf') {
            loadPDFFromFile(file);
        } else if (file) {
            alert("请选择一个有效的 PDF 文件");
        }
        event.target.value = '';
    }
    
    function quickAddCurrentNote() {
        if (!pdfDoc) {
            alert("请先打开一个PDF文件");
            return;
        }
        const content = prompt(`在第 ${currentPageNum} 页添加笔记:`, "");
        if (content && content.trim() !== "") {
            addNote(currentPageNum, content);
        } else if (content !== null) {
            alert("笔记内容不能为空");
        }
    }
    
    function handleAddNoteFromForm() {
        if (!pdfDoc) {
            alert("请先打开PDF文件");
            return;
        }
        let pageRaw = notePageNumInput.value.trim();
        let pageNum = pageRaw === "" ? currentPageNum : parseInt(pageRaw);
        if (isNaN(pageNum)) pageNum = currentPageNum;
        const text = noteContentTa.value.trim();
        if (text === "") {
            alert("请填写笔记内容");
            return;
        }
        if (addNote(pageNum, text)) {
            noteContentTa.value = "";
            notePageNumInput.value = currentPageNum;
        }
    }
    
    function bindEvents() {
        prevBtn.addEventListener('click', prevPage);
        nextBtn.addEventListener('click', nextPage);
        jumpBtn.addEventListener('click', () => {
            if (!pdfDoc) { alert("请先打开PDF"); return; }
            let target = parseInt(jumpInput.value);
            if (!isNaN(target) && target >= 1 && target <= totalPages) {
                goToPage(target);
            } else {
                alert(`请输入1-${totalPages}之间的页码`);
            }
        });
        quickNoteBtn.addEventListener('click', quickAddCurrentNote);
        addNoteBtn.addEventListener('click', handleAddNoteFromForm);
        pdfFileInput.addEventListener('change', onFileSelected);
        window.addEventListener('resize', handleResize);
        toggleOutlineBtn.addEventListener('click', toggleOutline);
        toggleNotesBtn.addEventListener('click', toggleNotes);
        
        window.addEventListener('pageChanged', () => {
            if (notePageNumInput) notePageNumInput.value = currentPageNum;
        });
    }
    
    // 装饰函数
    const originalRenderPage = renderPage;
    async function wrappedRenderPage(pageNumber) {
        await originalRenderPage(pageNumber);
        window.dispatchEvent(new Event('pageChanged'));
    }
    const originalGoToPage = goToPage;
    function wrappedGoToPage(page) {
        originalGoToPage(page);
        window.dispatchEvent(new Event('pageChanged'));
    }
    window.renderPage = wrappedRenderPage;
    window.goToPage = wrappedGoToPage;
    renderPage = wrappedRenderPage;
    goToPage = wrappedGoToPage;
    
    function init() {
        bindEvents();
        observeContainerResize();
        loadPanelState();
        canvas.style.display = 'none';
        pdfPlaceholderDiv.style.display = 'flex';
        outlineContainer.innerHTML = '<div class="no-outline">请先选择 PDF 文件</div>';
        notesListContainer.innerHTML = '<div class="empty-notes">📂 选择PDF后，笔记会自动跟随文件保存</div>';
        currentFileNameSpan.innerText = "未打开文件";
        pageInfoSpan.innerText = `第 - / - 页`;
    }
    
    init();
</script>
</body>
</html>
